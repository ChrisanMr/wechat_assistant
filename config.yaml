# ============================================================
# 微信聊天模仿助手 - 配置文件（本地离线版）
# 所有数据都保存在本机，不联网、不调用微信接口
# ============================================================

# ---------- 1. 我是谁 ----------
identity:
  # 聊天记录里代表“我”的说话人名字（可写多个，例如你的微信昵称）
  me_names: ["我", "本人", "自己"]
  # 生成回复时的自称（一般不用改）
  self_name: "我"

# ---------- 2. 目录设置（相对项目根目录，一般不用改） ----------
paths:
  chat_records: chat_records      # 原始聊天记录（每人一个 txt）
  persona: persona                # 人设档案（每人一个 yaml）
  emoji_lib: emoji_lib            # 表情包图片目录
  emoji_tag_csv: emoji_lib/emoji_tag.csv   # 表情包标签表

# ---------- 3. 回复生成引擎 ----------
generator:
  engine: local          # local = 纯本地规则引擎（默认，不联网）
                         # ollama = 调用本机 Ollama 大模型（仍然是本地，可选）
  candidates: 3          # 每次生成几条备选回复（2~3 条）
  max_chars: 60          # 单条回复最长字数（超过会被压缩）
  use_emoji_char: true   # 是否允许在文字里带上我常用的表情符号
  ollama:                # 仅当 engine: ollama 时生效，纯本地地址
    host: "http://127.0.0.1:11434"
    model: "qwen2.5:7b"
    timeout: 120

# ---------- 4. 学习参数 ----------
learning:
  top_words: 20          # 高频词取前 N 个
  top_phrases: 12        # 口头禅取前 N 个
  max_examples: 12       # 人设档案里保存的回复示例条数
  incremental: true      # 再次学习时是否与旧档案合并（追加新聊天记录用）

# ---------- 5. 联系人关系（可留空，留空则从文件名“关系_名字.txt”推断） ----------
contacts:
  妈妈: 家人
  小张: 朋友
  李工: 同事

# ---------- 6. 关系 -> 基础语气 ----------
relation_tone:
  朋友: 沙雕
  家人: 温和
  同事: 正式
  未知: 中性

# ---------- 7. 禁忌话术（生成时绝不出现；全是“我不会这么说”的话） ----------
forbidden:
  global:
    - "作为AI"
    - "作为人工智能"
    - "作为一名AI助手"
    - "希望对你有所帮助"
    - "希望以上内容对你有帮助"
    - "综上所述"
    - "总而言之"
    - "总的来说"
    - "首先，"
    - "其次，"
    - "最后，"
    - "亲爱的用户"
    - "尊敬的客户"
    - "友情提示"
    - "值得注意的是"
    - "如有疑问请随时联系"
  家人:
    - "滚"
    - "闭嘴"
  同事:
    - "笑死"
    - "卧槽"
    - "草"
    - "哈哈哈"
  朋友:
    - "收到，我将在稍后处理"
    - "您好，请问有什么可以帮您"

# ---------- 8. 对方消息 -> 意图（关键词规则，可自由增删） ----------
intents:
  告别: ["晚安", "睡了", "我先忙", "先这样", "不聊了", "回头聊", "拜拜", "再见", "下线", "走了", "先撤"]
  道歉: ["对不起", "抱歉", "不好意思", "我的错", "sorry", "赔罪"]
  感谢: ["谢谢", "多谢", "感谢", "辛苦了", "麻烦你了", "费心了"]
  问候: ["在吗", "在么", "在不在", "在不在线", "早上好", "早安", "中午好", "晚上好", "哈喽", "hi", "hello", "干嘛呢", "在干嘛", "忙不忙", "好久不见", "吃了没", "睡了吗"]
  邀约: ["一起", "出来", "约", "聚餐", "喝酒", "吃饭", "来我家", "去不去", "周末", "有空吗", "晚上有安排", "打球", "开黑"]
  吐槽: ["烦死", "好烦", "累死", "难受", "崩溃", "气死", "无语", "倒霉", "加班", "压力", "郁闷", "吐了", "服了", "裂开"]
  安慰: ["加油", "别难过", "会好的", "抱抱", "别想太多", "开心点"]
  工作: ["方案", "文档", "会议", "需求", "项目", "汇报", "排期", "上线", "客户", "合同", "数据", "报表", "邮件", "评审", "对齐", "进度", "周报"]
  分享: ["我买了", "我今天", "你看", "给你看", "我发现", "我刚", "推荐", "安利", "刚看", "试了", "去了"]
  关心: ["记得", "别忘了", "别忘", "注意", "多穿", "多喝", "早点睡", "别熬夜", "天冷", "天热", "下雨", "小心", "保重", "吃饭了没"]
  提问: ["吗", "怎么", "为什么", "为啥", "啥", "什么", "哪", "多少", "能不能", "可不可以", "是不是", "有没有", "几点", "谁", "如何", "？", "?"]
  分享: ["我买了", "我今天", "你看", "给你看", "我发现", "我刚", "推荐", "安利", "刚看", "试了", "去了"]

# ---------- 9. 意图 -> 回复模板 ----------
# 占位符说明：
#   {口头禅}  从人设档案的“口头禅”里随机取
#   {高频词}  从人设档案的“高频词”里随机取
#   {关键词}  从对方消息里抽出来的关键词
#   {话题}    对方消息的简短概括
reply_templates:
  问候:
    短: ["在呢", "在的", "嗯？", "咋啦", "咋了"]
    中: ["在呢，咋啦", "在的，你说", "在，怎么了", "在的，啥事"]
    长: ["在的在的，刚看到消息", "在呢在呢，刚在忙，你说"]
  提问:
    短: ["我看看", "我想想", "让我想想"]
    中: ["我想想哈", "这个我得看下", "我看看再回你"]
    长: ["我看看哈，等下回你", "这个我得确认一下，晚点跟你说"]
  邀约:
    短: ["行", "可以", "来", "冲", "走"]
    中: ["行啊，几点", "可以可以，在哪", "来呗"]
    长: ["可以啊，你定时间我过去", "行，几点在哪你说"]
  吐槽:
    短: ["哈哈哈哈", "确实", "太惨了", "离谱"]
    中: ["哈哈哈哈太惨了", "确实有点离谱", "哎，太难了"]
    长: ["哈哈哈哈这也太惨了吧", "哎，确实挺难的，别想太多"]
  感谢:
    短: ["客气", "没事", "小事"]
    中: ["客气啥", "没事儿，小事情", "不用谢"]
    长: ["客气啥，有事说话", "小事情，不用这么客气"]
  道歉:
    短: ["没事", "没事啦", "别放心上"]
    中: ["没事没事，别放心上", "哎呀没事的"]
    长: ["真没事，你别想太多", "没事没事，谁还没个失误"]
  告别:
    短: ["好", "晚安", "早点睡", "拜拜"]
    中: ["好，晚安", "行，早点睡", "好的，拜"]
    长: ["好嘞，那你早点休息", "行，那先这样，明天聊"]
  工作:
    短: ["收到", "好的", "我看下"]
    中: ["好的，我看下", "收到，稍后回复你", "行，我这边跟一下"]
    长: ["好的，我看一下，稍后同步给你", "收到，我这边先确认下再回复你"]
  分享:
    短: ["牛啊", "不错", "可以啊"]
    中: ["哎不错啊", "可以可以，看着挺好"]
    长: ["可以啊，看着挺不错的", "哎这个不错，在哪弄的"]
  关心:
    短: ["知道啦", "好嘞", "嗯嗯"]
    中: ["知道啦，我会注意的", "好嘞，我知道了", "嗯嗯，我记着了"]
    长: ["好的，我记住了，你也注意点", "知道啦，我会注意的，你放心"]
  安慰:
    短: ["加油", "会好的", "别急"]
    中: ["加油，会好的", "别急，慢慢来"]
    长: ["别急，慢慢来，会好起来的", "加油，有事跟我说"]
  日常:
    短: ["嗯嗯", "是啊", "哦哦", "行吧"]
    中: ["嗯嗯，是这样", "是啊，我也觉得"]
    长: ["嗯嗯，我这边也差不多", "是啊，最近都这样"]

# ---------- 10. 语气专用模板（优先级高于上面的 reply_templates） ----------
# 同一个意图，对不同语气的人说法不一样：对同事要正式，对朋友可以随便。
# 例：问候 → 同事「在的，你说」；朋友「在呢，咋啦」
tone_templates:
  正式:
    问候: {短: ["在的"], 中: ["在的，你说"], 长: ["在的，刚看到消息，你说"]}
    邀约: {短: ["可以"], 中: ["可以，几点"], 长: ["可以，时间地点你定，我过去"]}
    吐槽: {短: ["确实"], 中: ["确实有点难"], 长: ["确实不容易，先别急，慢慢来"]}
    日常: {短: ["好的"], 中: ["好的，明白"], 长: ["好的，我这边也差不多"]}
    告别: {短: ["好"], 中: ["好的，早点休息"], 长: ["好的，那先这样，明天再聊"]}
    分享: {短: ["不错"], 中: ["看起来不错"], 长: ["看着挺好的，在哪弄的"]}
    关心: {短: ["好的"], 中: ["好的，我会注意"], 长: ["好的，我记着了，谢谢提醒"]}
    提问: {短: ["我看下"], 中: ["我看下再回复你"], 长: ["我确认一下，稍后回复你"]}
    安慰: {短: ["会的"], 中: ["会好起来的"], 长: ["别太着急，慢慢来就好"]}
  温和:
    邀约: {短: ["好呀"], 中: ["好呀，几点"], 长: ["好呀，你定时间我过去"]}
    感谢: {短: ["客气啥"], 中: ["客气啥，应该的"], 长: ["客气啥，应该的，有事你说"]}
    日常: {短: ["嗯嗯"], 中: ["嗯嗯，我知道了"], 长: ["嗯嗯，我这边挺好的，你放心"]}
  沙雕:
    问候: {短: ["在呢", "咋啦"], 中: ["在呢，咋啦", "在的，啥事"], 长: ["在的在的，刚在忙，你说"]}
    日常: {短: ["确实", "6"], 中: ["确实是这样", "哈哈哈哈确实"], 长: ["哈哈哈哈确实，我也这么觉得"]}

# ---------- 11. 语气修饰（在人设语气上再润色一下） ----------
# head = 加在回复前面的语气前缀；tail = 加在后面的语气后缀（只在句子很短时加）
tone_flavor:
  沙雕:
    head: ["哈哈哈", "哈哈", "笑死，"]
    tail: []
  温和:
    head: []
    tail: ["~", "啦", "呀", "哈"]
  正式:
    head: ["好的，"]
    tail: ["，谢谢"]
  中性:
    head: []
    tail: []
  简短:
    head: []
    tail: []

# ---------- 12. 语气 -> 加分的表情包标签 ----------
tone_emoji_bonus:
  沙雕: ["搞笑", "哈哈", "无语"]
  温和: ["感谢", "安慰", "加油"]
  正式: ["收到", "OK", "感谢"]
  中性: ["收到"]
  简短: ["OK"]

